<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충북 제조기업 지도 &amp; 이동경로 분석</title>
<style>
  :root{
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --border:#E3E6EA;
    --ink:#1C2430;
    --ink-soft:#6B7684;
    --navy:#1B4B5A;
    --navy-deep:#123640;
    --teal:#2C8C99;
    --amber:#E8792E;
    --amber-soft:#FCE7D6;
    --ok:#2F9E63;
    --warn:#D6473C;
    --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy-deep);
    color:#fff;
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--amber);
    z-index:30;
  }
  header h1{
    font-size:16px;
    font-weight:700;
    margin:0 18px 0 0;
    letter-spacing:-0.2px;
    white-space:nowrap;
  }
  header h1 span{
    display:block;
    font-size:10.5px;
    font-weight:500;
    color:#9FC3CC;
    letter-spacing:0.3px;
    margin-top:1px;
  }
  .hcontrol{display:flex;align-items:center;gap:6px;font-size:12px;color:#CFE3E7;}
  .hcontrol select, .hcontrol input{
    font-family:var(--sans);
    font-size:12.5px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid #2C5B67;
    background:#0F2C34;
    color:#fff;
    outline:none;
  }
  .hcontrol input[type=number]{width:58px;font-family:var(--mono);}
  .hdiv{width:1px;align-self:stretch;background:#2C5B67;margin:2px 4px;}
  button.btn{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    padding:6px 14px;
    border-radius:6px;
    border:1px solid transparent;
    cursor:pointer;
    transition:filter .12s ease, transform .05s ease;
  }
  button.btn:active{transform:translateY(1px);}
  button.btn-primary{background:var(--amber); color:#241000;}
  button.btn-primary:hover{filter:brightness(1.08);}
  button.btn-ghost{background:transparent;border-color:#2C5B67;color:#EAF3F4;}
  button.btn-ghost:hover{background:#0F2C34;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- Body layout ---------- */
  .layout{flex:1;display:flex;min-height:0;position:relative;}
  #map{flex:1;min-width:0;height:100%;background:#dfe3e6;}

  /* progress overlay */
  #progressWrap{
    position:absolute; left:16px; bottom:16px; z-index:20;
    background:rgba(18,54,64,.92); color:#fff; border-radius:10px;
    padding:12px 16px; width:280px; box-shadow:0 6px 20px rgba(0,0,0,.25);
    font-size:12px;
  }
  #progressWrap.hidden{display:none;}
  #progressWrap .ptitle{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
  #progressBarOuter{height:6px;border-radius:4px;background:#2C5B67;overflow:hidden;}
  #progressBarInner{height:100%;width:0%;background:var(--amber);transition:width .15s ease;}
  #progressSub{margin-top:6px;color:#B9D3D8;font-family:var(--mono);font-size:11px;}

  /* legend */
  #legend{
    position:absolute; right:16px; top:16px; z-index:20;
    background:rgba(255,255,255,.96); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:11.5px; color:var(--ink-soft); box-shadow:0 4px 14px rgba(0,0,0,.08);
    display:none;
  }
  #legend.show{display:block;}
  #legend .lgtitle{font-weight:700;color:var(--ink);margin-bottom:6px;font-size:12px;}
  #legend .lgrow{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  #legend .lgswatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  /* ---------- Side panel ---------- */
  #side{
    width:380px; flex-shrink:0; background:var(--panel);
    border-left:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
  }
  .tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
  .tabbtn{
    flex:1; padding:12px 8px; text-align:center; font-size:12.5px; font-weight:700;
    color:var(--ink-soft); cursor:pointer; background:none; border:none;
    border-bottom:2px solid transparent; font-family:var(--sans);
  }
  .tabbtn.active{color:var(--navy-deep); border-bottom-color:var(--amber);}
  .tabpane{flex:1; overflow-y:auto; display:none;}
  .tabpane.active{display:block;}

  /* company detail */
  #detailEmpty{padding:40px 24px; color:var(--ink-soft); font-size:13px; text-align:center; line-height:1.7;}
  .detailCard{padding:20px;}
  .detailCard .dName{font-size:16.5px; font-weight:800; color:var(--navy-deep); line-height:1.35; margin-bottom:4px;}
  .detailCard .dType{display:inline-block; font-size:11px; font-weight:700; color:var(--teal); background:#E6F3F2; padding:2px 8px; border-radius:20px; margin-bottom:14px;}
  .dRow{padding:10px 0; border-top:1px solid var(--border);}
  .dRow:first-of-type{border-top:none;}
  .dLabel{font-size:10.5px; font-weight:700; color:#96A0AB; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px;}
  .dValue{font-size:13px; color:var(--ink); line-height:1.5;}
  .dValue.empty{color:#C3C9D0; font-style:italic;}
  .dRegionTag{display:inline-block; margin-top:10px; font-size:11px; font-weight:700; color:#fff; background:var(--navy); padding:3px 9px; border-radius:5px;}

  /* route pane */
  #routeEmpty{padding:40px 24px; color:var(--ink-soft); font-size:13px; text-align:center; line-height:1.7;}
  .routeSummary{padding:16px 20px; border-bottom:1px solid var(--border); background:#FAFBFC;}
  .routeSummary .rsRegion{font-size:15px; font-weight:800; color:var(--navy-deep);}
  .routeSummary .rsStats{display:flex; gap:14px; margin-top:8px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
  .routeSummary .rsStats b{color:var(--ink); font-weight:700;}
  .routeSummary .rsNote{margin-top:8px; font-size:10.5px; color:#96A0AB; line-height:1.5;}

  .groupBlock{border-bottom:1px solid var(--border);}
  .groupHead{
    display:flex; align-items:center; gap:8px; padding:10px 20px;
    background:#F7F8FA; font-size:12px; font-weight:700; color:var(--ink);
    position:sticky; top:0;
  }
  .groupDot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .groupHead .gcount{margin-left:auto; font-weight:500; color:var(--ink-soft); font-family:var(--mono); font-size:11px;}

  .stopRow{display:flex; gap:10px; padding:10px 20px 10px 16px; cursor:pointer; align-items:flex-start;}
  .stopRow:hover{background:#F7FAFA;}
  .stopNum{
    width:22px;height:22px;border-radius:50%; flex-shrink:0; color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; margin-top:1px; font-family:var(--mono);
  }
  .stopBody{flex:1; min-width:0;}
  .stopName{font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.4;}
  .stopAddr{font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .legInfo{
    margin:4px 20px 4px 48px; padding:5px 10px; font-size:10.5px; border-radius:6px;
    font-family:var(--mono); display:flex; gap:10px; align-items:center;
  }
  .legInfo.within{background:#E9F7EF; color:#1E7A4C;}
  .legInfo.over{background:#FDECEA; color:var(--warn); font-weight:700;}
  .legInfo .legArrow{color:#B8C0C8;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D3D8DD;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .numOverlay{
    width:24px;height:24px;border-radius:50% 50% 50% 4px; transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35);
    border:2px solid #fff;
  }
  .numOverlay span{transform:rotate(45deg); color:#fff; font-size:11px; font-weight:800; font-family:var(--mono);}

  @media (max-width:900px){
    #side{width:320px;}
    header h1{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <h1>충북 제조기업 지도<span>KAKAO MAP · 기업 좌표 시각화 &amp; 지역 이동경로 분석</span></h1>

  <div class="hcontrol">
    <label>지역 필터</label>
    <select id="filterRegion"><option value="">전체 (로딩 중…)</option></select>
  </div>

  <div class="hdiv"></div>

  <div class="hcontrol">
    <label>경로 지역</label>
    <select id="routeRegion"><option value="">지역 선택</option></select>
  </div>
  <div class="hcontrol">
    <label>평균속도(km/h)</label>
    <input type="number" id="speedInput" value="40" min="10" max="110">
  </div>
  <div class="hcontrol">
    <label>도로계수</label>
    <input type="number" id="factorInput" value="1.3" min="1" max="2" step="0.05">
  </div>
  <div class="hcontrol">
    <label>기준(분)</label>
    <input type="number" id="thresholdInput" value="90" min="10" max="300">
  </div>
  <button class="btn btn-primary" id="calcRouteBtn" disabled>경로 계산</button>
  <button class="btn btn-ghost" id="clearRouteBtn">경로 지우기</button>
</header>

<div class="layout">
  <div id="map"></div>

  <div id="progressWrap">
    <div class="ptitle"><span>주소 → 좌표 변환 중</span><span id="progressPct">0%</span></div>
    <div id="progressBarOuter"><div id="progressBarInner"></div></div>
    <div id="progressSub">0 / 0 완료 · 실패 0건</div>
  </div>

  <div id="legend">
    <div class="lgtitle">이동 그룹 (기준 초과 시 구간 분리)</div>
    <div id="legendBody"></div>
  </div>

  <div id="side">
    <div class="tabs">
      <button class="tabbtn active" id="tabBtnDetail">기업 상세</button>
      <button class="tabbtn" id="tabBtnRoute">이동경로 결과</button>
    </div>

    <div class="tabpane active" id="paneDetail">
      <div id="detailEmpty">지도의 점(마커)을 클릭하면<br>해당 기업의 상세 정보가<br>이곳에 표시됩니다.</div>
      <div class="detailCard" id="detailCard" style="display:none;"></div>
    </div>

    <div class="tabpane" id="paneRoute">
      <div id="routeEmpty">상단에서 시/군/구를 선택하고<br>&quot;경로 계산&quot; 버튼을 누르면<br>해당 지역 기업들의 방문 순서와<br>이동 경로가 표시됩니다.</div>
      <div id="routeResult" style="display:none;"></div>
    </div>
  </div>
</div>

/* ---------- 1. 지역(시/도 + 시/군/구) 추출 ---------- */
const PROVINCE_MAP = {
  '서울특별시':'서울','서울시':'서울','서울':'서울',
  '부산광역시':'부산','부산시':'부산','부산':'부산',

  '광주광역시':'광주','광주시':'광주','광주':'광주',
  '대전광역시':'대전','대전시':'대전','대전':'대전',
  '울산광역시':'울산','울산시':'울산','울산':'울산',
  '세종특별자치시':'세종','세종시':'세종','세종':'세종',
  '경기도':'경기','경기':'경기',

  '전라남도':'전남','전남':'전남',
  '경상북도':'경북','경북':'경북',

  '제주특별자치도':'제주','제주도':'제주','제주':'제주'
};
const PROV_KEYS = Object.keys(PROVINCE_MAP).sort((a,b)=>b.length-a.length);
const REGION_RE = new RegExp('^(' + PROV_KEYS.join('|') + ')\\s+(\\S+?[시군구])(?=\\s|$)(?:\\s+(\\S+?구)(?=\\s|$))?');

function extractRegion(addr){
  if(!addr) return null;
  const m = addr.trim().match(REGION_RE);
  if(!m) return null;
  const prov = PROVINCE_MAP[m[1]];
  let region = prov + ' ' + m[2];
  if(m[3]) region += ' ' + m[3];
  return region;
}

    map: map,
    averageCenter: true,

    disableClickZoom: false,
    styles: [{
      width:'40px', height:'40px', background:'rgba(27,75,90,.85)',
      borderRadius:'50%', color:'#fff', textAlign:'center',
      lineHeight:'40px', fontWeight:'800', fontSize:'12px', border:'2px solid #fff'
    }]
  });
  startGeocoding();
}

/* ---------- 3. 지오코딩 (주소 -> 좌표) ---------- */
function geocodeAddr(addr){
  return new Promise((resolve)=>{
    if(!addr){ resolve(null); return; }
    geocoder.addressSearch(addr, (result, status)=>{
      if(status === kakao.maps.services.Status.OK && result && result[0]){
        resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
      } else {
        resolve(null);
      }
    });
  });
}

async function geocodeCompany(c){
  const p1 = primaryAddr(c);
  let coord = await geocodeAddr(p1);
  let usedAddr = p1;
  if(!coord){
    const p2 = fallbackAddr(c);
    if(p2){
      coord = await geocodeAddr(p2);
      usedAddr = p2;
    }
  }
  return { coord, usedAddr };
}

let geocodedCount = 0, failedCount = 0;
const regionCounts = {}; // region -> count of successfully geocoded companies

function updateProgress(done, total){
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBarInner').style.width = pct + '%';
  document.getElementById('progressSub').textContent = `${done} / ${total} 완료 · 실패 ${failedCount}건`;
}

async function startGeocoding(){
  const total = COMPANIES.length;
  updateProgress(0, total);

  const CONCURRENCY = 6;
  let idx = 0;
  let done = 0;

  async function worker(){
    while(idx < COMPANIES.length){
      const myIdx = idx++;
      const c = COMPANIES[myIdx];
      const { coord, usedAddr } = await geocodeCompany(c);
      if(coord){
        c.lat = coord.lat; c.lng = coord.lng; c.geocodedAddr = usedAddr;
        c.region = extractRegion(usedAddr) || extractRegion(c.hqAddr) || '기타';
        regionCounts[c.region] = (regionCounts[c.region]||0) + 1;
        addMarker(c);
        geocodedCount++;
      } else {
        failedCount++;
      }
      done++;
      if(done % 3 === 0 || done === total) updateProgress(done, total);
    }
  }

  const workers = [];
  for(let i=0;i<CONCURRENCY;i++) workers.push(worker());
  await Promise.all(workers);

  updateProgress(total, total);
  finishGeocoding();
}

function finishGeocoding(){
  setTimeout(()=>{
    document.getElementById('progressWrap').classList.add('hidden');
  }, 900);
  populateRegionDropdowns();
  document.getElementById('calcRouteBtn').disabled = false;
}

/* ---------- 4. 마커 생성 & 클릭 처리 ---------- */
function addMarker(c){
  const pos = new kakao.maps.LatLng(c.lat, c.lng);
  const marker = new kakao.maps.Marker({ position: pos });
  markerById[c.id] = marker;
  kakao.maps.event.addListener(marker, 'click', ()=> selectCompany(c.id, true));
  clusterer.addMarker(marker);
}

function setMarkerActive(id, active){
  const marker = markerById[id];
  if(!marker) return;
  // simple visual cue: bounce via z-index + slight image swap is complex without extra assets,
  // so we use InfoWindow-less highlight: temporarily change z-index and use setRange animation.
  marker.setZIndex(active ? 999 : 1);
}

function selectCompany(id, panTo){
  const c = COMPANIES.find(x=>x.id===id);
  if(!c) return;
  if(selectedMarker !== null) setMarkerActive(selectedMarker, false);
  selectedMarker = id;
  setMarkerActive(id, true);
  renderDetail(c);
  switchTab('detail');
  if(panTo && c.lat){
    map.panTo(new kakao.maps.LatLng(c.lat, c.lng));
  }
}

function renderDetail(c){
  document.getElementById('detailEmpty').style.display = 'none';
  const card = document.getElementById('detailCard');
  card.style.display = 'block';
  const field = (label, val) => `
    <div class="dRow">
      <div class="dLabel">${label}</div>
      <div class="dValue ${val ? '' : 'empty'}">${val ? escapeHtml(val) : '정보 없음'}</div>
    </div>`;
  card.innerHTML = `
    <div class="dName">${escapeHtml(c.name || '이름 없음')}</div>
    <div class="dType">${escapeHtml(c.type || '분류 미상')}</div>
    ${field('업종명', c.industry)}
    ${field('주요제품명', c.product)}
    ${field('본사주소', c.hqAddr)}
    ${field('사업장주소', c.bizAddr)}
    ${c.region ? `<span class="dRegionTag">${escapeHtml(c.region)}</span>` : ''}
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- 5. 탭 전환 ---------- */
function switchTab(which){
  const isDetail = which === 'detail';
  document.getElementById('tabBtnDetail').classList.toggle('active', isDetail);
  document.getElementById('tabBtnRoute').classList.toggle('active', !isDetail);
  document.getElementById('paneDetail').classList.toggle('active', isDetail);
  document.getElementById('paneRoute').classList.toggle('active', !isDetail);
}
document.getElementById('tabBtnDetail').addEventListener('click', ()=>switchTab('detail'));
document.getElementById('tabBtnRoute').addEventListener('click', ()=>switchTab('route'));

/* ---------- 6. 지역 필터 & 드롭다운 구성 ---------- */
function populateRegionDropdowns(){
  const sorted = Object.entries(regionCounts).sort((a,b)=>b[1]-a[1]);

  const filterSel = document.getElementById('filterRegion');
  filterSel.innerHTML = '<option value="">전체 (' + COMPANIES.filter(c=>c.lat).length + '개)</option>';
  const routeSel = document.getElementById('routeRegion');
  routeSel.innerHTML = '<option value="">지역 선택</option>';

  sorted.forEach(([region,count])=>{
    const o1 = document.createElement('option');
    o1.value = region; o1.textContent = `${region} (${count})`;
    filterSel.appendChild(o1);

    const o2 = document.createElement('option');
    o2.value = region; o2.textContent = `${region} (${count})`;
    routeSel.appendChild(o2);
  });
}

document.getElementById('filterRegion').addEventListener('change', (e)=>{
  const region = e.target.value;
  clusterer.clear();
  const visible = [];
  COMPANIES.forEach(c=>{
    if(!c.lat) return;
    if(!region || c.region === region){
      visible.push(markerById[c.id]);
    }
  });
  clusterer.addMarkers(visible);
  if(visible.length){
    const bounds = new kakao.maps.LatLngBounds();
    visible.forEach(m=>bounds.extend(m.getPosition()));
    map.setBounds(bounds);
  }
});

/* ---------- 7. 이동경로 계산 (직선거리 기반 추정) ---------- */
function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const lat1 = a.lat * Math.PI/180, lat2 = b.lat * Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function estimateMinutes(distKm, speedKmh, roadFactor){
  return (distKm * roadFactor) / speedKmh * 60;
}

/* Nearest-neighbor 순회 경로 생성: 서쪽(경도 최소) 지점에서 시작 */
function buildNearestNeighborRoute(points){
  const remaining = points.slice();
  remaining.sort((a,b)=>a.lng-b.lng);
  const route = [remaining.shift()];
  const legs = [];
  while(remaining.length){
    const cur = route[route.length-1];
    let bestIdx = -1, bestDist = Infinity;
    remaining.forEach((p,i)=>{
      const d = haversineKm(cur, p);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx,1)[0];
    legs.push({ from: cur, to: next, distKm: bestDist });
    route.push(next);
  }
  return { route, legs };
}

/* 기준(분)을 초과하는 구간에서 그룹을 분리 */
function splitIntoGroups(route, legs, speedKmh, roadFactor, thresholdMin){
  const groups = [];
  let current = [route[0]];
  legs.forEach(leg=>{
    const minutes = estimateMinutes(leg.distKm, speedKmh, roadFactor);
    leg.timeMin = minutes;
    leg.within = minutes <= thresholdMin;
    if(leg.within){
      current.push(leg.to);
    } else {
      groups.push(current);
      current = [leg.to];
    }
  });
  groups.push(current);
  return groups;
}

function clearRouteOverlays(){
  routeOverlays.forEach(o=> o.setMap(null));
  routeOverlays.length = 0;
  document.getElementById('legend').classList.remove('show');
}

document.getElementById('clearRouteBtn').addEventListener('click', ()=>{
  clearRouteOverlays();
  document.getElementById('routeEmpty').style.display = 'block';
  document.getElementById('routeResult').style.display = 'none';
  document.getElementById('routeResult').innerHTML = '';
});

document.getElementById('calcRouteBtn').addEventListener('click', ()=>{
  const region = document.getElementById('routeRegion').value;
  if(!region){ alert('경로를 계산할 시/군/구를 선택해 주세요.'); return; }

  const speed = parseFloat(document.getElementById('speedInput').value) || 40;
  const factor = parseFloat(document.getElementById('factorInput').value) || 1.3;
  const threshold = parseFloat(document.getElementById('thresholdInput').value) || 90;

  const points = COMPANIES.filter(c => c.lat && c.region === region);
  if(points.length < 2){
    alert('해당 지역에 좌표가 확인된 기업이 2개 미만입니다.');
    return;
  }

  clearRouteOverlays();

  const { route, legs } = buildNearestNeighborRoute(points);
  const groups = splitIntoGroups(route, legs, speed, factor, threshold);

  drawRoute(groups, legs);
  renderRouteResult(region, groups, legs, speed, factor, threshold);
  switchTab('route');
});

/* ---------- 8. 경로 지도에 그리기 ---------- */
function drawRoute(groups, legs){
  const bounds = new kakao.maps.LatLngBounds();
  let globalOrder = 1;

  groups.forEach((group, gi)=>{
    const color = GROUP_PALETTE[gi % GROUP_PALETTE.length];
    const path = group.map(p => new kakao.maps.LatLng(p.lat, p.lng));
    path.forEach(p=>bounds.extend(p));

    const polyline = new kakao.maps.Polyline({
      path: path,
      strokeWeight: 4,
      strokeColor: color,
      strokeOpacity: 0.85,
      strokeStyle: 'solid'
    });
    polyline.setMap(map);
    routeOverlays.push(polyline);

    group.forEach((p)=>{
      const el = document.createElement('div');
      el.className = 'numOverlay';
      el.style.background = color;
      el.innerHTML = `<span>${globalOrder}</span>`;
      const overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(p.lat, p.lng),
        content: el,
        yAnchor: 1.1,
        zIndex: 10
      });
      overlay.setMap(map);
      routeOverlays.push(overlay);
      globalOrder++;
    });
  });

  map.setBounds(bounds);
  renderLegend(groups);
}

function renderLegend(groups){
  const body = document.getElementById('legendBody');
  body.innerHTML = groups.map((g,i)=>{
    const color = GROUP_PALETTE[i % GROUP_PALETTE.length];
    return `<div class="lgrow"><span class="lgswatch" style="background:${color}"></span>그룹 ${i+1} · ${g.length}개 지점</div>`;
  }).join('');
  document.getElementById('legend').classList.add('show');
}

/* ---------- 9. 경로 결과 패널 렌더 ---------- */
function renderRouteResult(region, groups, legs, speed, factor, threshold){
  document.getElementById('routeEmpty').style.display = 'none';
  const wrap = document.getElementById('routeResult');
  wrap.style.display = 'block';

  const totalStops = groups.reduce((s,g)=>s+g.length,0);
  const totalDist = legs.reduce((s,l)=>s+l.distKm,0);
  const overCount = legs.filter(l=>!l.within).length;

  let html = `
    <div class="routeSummary">
      <div class="rsRegion">${escapeHtml(region)}</div>
      <div class="rsStats">
        <span>지점 <b>${totalStops}</b>개</span>
        <span>총 이동거리(추정) <b>${totalDist.toFixed(1)}</b> km</span>
        <span>이동그룹 <b>${groups.length}</b>개</span>
        <span>기준초과 구간 <b>${overCount}</b>건</span>
      </div>
      <div class="rsNote">
        직선거리 × 도로계수 ${factor} ÷ 평균속도 ${speed}km/h 로 추정한 이동시간이며,
        연속 구간이 ${threshold}분을 초과하면 새 이동그룹으로 분리됩니다. (실제 도로 소요시간과 다를 수 있습니다)
      </div>
    </div>
  `;

  let order = 1;
  groups.forEach((group, gi)=>{
    const color = GROUP_PALETTE[gi % GROUP_PALETTE.length];
    html += `<div class="groupBlock">
      <div class="groupHead"><span class="groupDot" style="background:${color}"></span>이동그룹 ${gi+1}<span class="gcount">${group.length}개 지점</span></div>`;

    group.forEach((p, pi)=>{
      html += `
        <div class="stopRow" data-id="${p.id}">
          <div class="stopNum" style="background:${color}">${order}</div>
          <div class="stopBody">
            <div class="stopName">${escapeHtml(p.name||'이름 없음')}</div>
            <div class="stopAddr">${escapeHtml(p.geocodedAddr||'')}</div>
          </div>
        </div>`;
      order++;

      // leg info to next stop within same group
      if(pi < group.length - 1){
        const legIdx = legs.findIndex(l => l.from.id === p.id && l.to.id === group[pi+1].id);
        const leg = legIdx >= 0 ? legs[legIdx] : null;
        if(leg){
          html += `
            <div class="legInfo within">
              <span class="legArrow">↓</span>
              <span>${leg.distKm.toFixed(1)} km</span>
              <span>약 ${Math.round(leg.timeMin)}분</span>
            </div>`;
        }
      }
    });

    // show the connecting (over-threshold) leg to next group, if any
    if(gi < groups.length - 1){
      const lastP = group[group.length-1];
      const nextFirst = groups[gi+1][0];
      const legIdx = legs.findIndex(l => l.from.id === lastP.id && l.to.id === nextFirst.id);
      const leg = legIdx >= 0 ? legs[legIdx] : null;
      if(leg){
        html += `
          <div class="legInfo over">
            <span class="legArrow">↓</span>
            <span>${leg.distKm.toFixed(1)} km</span>
            <span>약 ${Math.round(leg.timeMin)}분 (기준 초과 → 그룹 분리)</span>
          </div>`;
      }
    }

    html += `</div>`;
  });

  wrap.innerHTML = html;

  wrap.querySelectorAll('.stopRow').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = parseInt(row.getAttribute('data-id'), 10);
      selectCompany(id, true);
    });
  });
}

/* ---------- 10. 부트스트랩 ---------- */
kakao.maps.load(initMap);
